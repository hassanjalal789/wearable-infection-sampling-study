# Checks that run on the published files alone: no source data, no withheld
# participant-level files and no secrets. They cover file integrity, the
# chronology validator, links, published aggregate arithmetic, the bootstrap
# intervals, the energy audit, the result tables and the test suite. They do not
# re-run the raw-data analysis, the upstream reproduction checks (Gate A), the
# Gate B tests (which need the source studies' workbooks) or the power
# calculation. See docs/REPRODUCIBILITY.md.
name: Public package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the publication verification environment
        run: python -m pip install -r environment/publication-requirements.txt
      - name: File checksums
        run: sha256sum -c evidence/SHA256SUMS.txt --quiet
      - name: Chronology validator
        run: python src/validate_chronology.py
      - name: Links, arithmetic, intervals, energy audit and result tables
        run: python src/check_public_package.py
      - name: Test suite
        run: python -m pytest tests/ -q -p no:cacheprovider
